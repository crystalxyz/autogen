
# One-turn baseline: Qwen3-8B non-thinking mode

servers:
  - model: "Qwen/Qwen3-8B"
    port: 40006
    tp: 1
    mem_fraction: 0.8
    device: 0
    extra_body:
      chat_template_kwargs:
        enable_thinking: false

benchmarks:
  - name: "humaneval_qwen3_8b_nothink"
    scenario_file: "benchmarks/HumanEval/Tasks/human_eval_AgentChat.jsonl"
    server_port: 40006
    repeat: 3

server_startup_timeout: 600
server_health_check_interval: 5
shutdown_timeout: 30

# Configuration for RoutedAgentChat benchmark.
# Launches 3 sglang servers (0.6B, 1.7B, 4B nothink) and runs the routed benchmark.
# The router (0.6B nothink) picks which model handles each task.

servers:
  - model: "Qwen/Qwen3-0.6B"
    port: 40001
    tp: 1
    mem_fraction: 0.8
    device: 0
    extra_body:
      chat_template_kwargs:
        enable_thinking: false

  - model: "Qwen/Qwen3-1.7B"
    port: 40002
    tp: 1
    mem_fraction: 0.8
    device: 1
    extra_body:
      chat_template_kwargs:
        enable_thinking: false

  - model: "Qwen/Qwen3-4B"
    port: 40003
    tp: 1
    mem_fraction: 0.8
    device: 2
    extra_body:
      chat_template_kwargs:
        enable_thinking: false

benchmarks:
  - name: "humaneval_routed"
    scenario_file: "benchmarks/HumanEval/Tasks/human_eval_RoutedAgentChat.jsonl"
    config_template: "benchmarks/HumanEval/Templates/RoutedAgentChat/config_template.yaml"
    server_port: 40001
    server_port_map:
      "router_config": 40001
      "model_configs.0.6b": 40001
      "model_configs.1.7b": 40002
      "model_configs.4b": 40003
    repeat: 1

server_startup_timeout: 600
server_health_check_interval: 5
shutdown_timeout: 30


# Two-turn benchmark configuration
# Turn 1: 4nt (port 31019)
# Turn 2: 14nt (port 31020)

servers:
- model: Qwen/Qwen3-4B
  port: 31019
  tp: 1
  mem_fraction: 0.95
  device: 0
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
- model: Qwen/Qwen3-14B
  port: 31020
  tp: 1
  mem_fraction: 0.95
  device: 1
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
benchmarks:
- name: humaneval_twoturn_4b_14b
  scenario_file: benchmarks/HumanEval/Tasks/human_eval_AgentChatCopyNoCtx.jsonl
  server_port: 31019
  config_template: scripts/configs/config-twoturn-template.yaml
  server_port_map:
    model_config_turn1: 31019
    model_config_turn2: 31020
  repeat: 2
server_startup_timeout: 600
server_health_check_interval: 5
shutdown_timeout: 30

# Four-turn benchmark configuration (v2 — frontier substitution)
# Turn 1: 4nt (port 31324)
# Turn 2: 4nt (port 31324)
# Turn 3: 8nt (port 31325)
# Turn 4: 14nt (port 31326)

servers:
- model: Qwen/Qwen3-4B
  port: 31324
  tp: 1
  mem_fraction: 0.95
  device: 0
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
- model: Qwen/Qwen3-8B
  port: 31325
  tp: 1
  mem_fraction: 0.95
  device: 1
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
- model: Qwen/Qwen3-14B
  port: 31326
  tp: 1
  mem_fraction: 0.95
  device: 2
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
benchmarks:
- name: humaneval_fourturn_4b_4b_8b_14b
  scenario_file: benchmarks/HumanEval/Tasks/human_eval_AgentChatCopyNoCtx.jsonl
  server_port: 31324
  config_template: scripts/configs/config-fourturn-template.yaml
  server_port_map:
    model_config_turn1: 31324
    model_config_turn2: 31324
    model_config_turn3: 31325
    model_config_turn4: 31326
  repeat: 3
server_startup_timeout: 600
server_health_check_interval: 5
shutdown_timeout: 30

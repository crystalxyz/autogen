
# Two-turn benchmark configuration
# Turn 1: qwen3-4b nothink (port 30039)
# Turn 2: qwen3-14b think (port 30040)

servers:
  - model: "Qwen/Qwen3-4B"
    port: 30039
    tp: 1
    mem_fraction: 0.95
    device: 0
    extra_body:
      chat_template_kwargs:
        enable_thinking: false

  - model: "Qwen/Qwen3-14B"
    port: 30040
    tp: 1
    mem_fraction: 0.95
    device: 1
    extra_body:
      chat_template_kwargs:
        enable_thinking: true

benchmarks:
  - name: "humaneval_twoturn_4b_14b"
    scenario_file: "benchmarks/HumanEval/Tasks/human_eval_AgentChatCopyNoCtx.jsonl"
    server_port: 30039
    config_template: "scripts/configs/config-twoturn-template.yaml"
    server_port_map:
      model_config_turn1: 30039
      model_config_turn2: 30040
    repeat: 2

server_startup_timeout: 600
server_health_check_interval: 5
shutdown_timeout: 30

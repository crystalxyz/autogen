# Four-turn benchmark configuration (v2 — frontier substitution)
# Turn 1: 4nt (port 31308)
# Turn 2: 8nt (port 31309)
# Turn 3: 1.7t (port 31310)
# Turn 4: 14t (port 31311)

servers:
- model: Qwen/Qwen3-4B
  port: 31308
  tp: 1
  mem_fraction: 0.95
  device: 0
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
- model: Qwen/Qwen3-8B
  port: 31309
  tp: 1
  mem_fraction: 0.95
  device: 1
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
- model: Qwen/Qwen3-1.7B
  port: 31310
  tp: 1
  mem_fraction: 0.95
  device: 2
  extra_body:
    chat_template_kwargs:
      enable_thinking: true
- model: Qwen/Qwen3-14B
  port: 31311
  tp: 1
  mem_fraction: 0.95
  device: 3
  extra_body:
    chat_template_kwargs:
      enable_thinking: true
benchmarks:
- name: humaneval_fourturn_4b_8b_1.7b_14b
  scenario_file: benchmarks/HumanEval/Tasks/human_eval_AgentChatCopyNoCtx.jsonl
  server_port: 31308
  config_template: scripts/configs/config-fourturn-template.yaml
  server_port_map:
    model_config_turn1: 31308
    model_config_turn2: 31309
    model_config_turn3: 31310
    model_config_turn4: 31311
  repeat: 3
server_startup_timeout: 600
server_health_check_interval: 5
shutdown_timeout: 30

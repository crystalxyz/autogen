# Config template for HotpotQA SelectorGroupChat (single-model).
# Three client handles: orchestrator (selector/termination/finalizer),
# coder (Assistant), and web_surfer. No file_surfer — the template
# deliberately excludes FileSurfer so all evidence comes from the web.

model_config: &client
  provider: autogen_ext.models.openai.OpenAIChatCompletionClient
  config:
    model: placeholder
    base_url: http://0.0.0.0:30004/v1
    api_key: EMPTY
    stream_options:
      include_usage: true
    model_info:
      family: Qwen
      vision: false
      function_calling: true
      json_output: true
      structured_output: true

orchestrator_client: *client
coder_client: *client
web_surfer_client: *client

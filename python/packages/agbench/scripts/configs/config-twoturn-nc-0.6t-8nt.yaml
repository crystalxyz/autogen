
# Two-turn benchmark configuration
# Turn 1: 0.6t (port 31035)
# Turn 2: 8nt (port 31036)

servers:
- model: Qwen/Qwen3-0.6B
  port: 31035
  tp: 1
  mem_fraction: 0.95
  device: 0
  extra_body:
    chat_template_kwargs:
      enable_thinking: true
- model: Qwen/Qwen3-8B
  port: 31036
  tp: 1
  mem_fraction: 0.95
  device: 1
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
benchmarks:
- name: humaneval_twoturn_0.6b_8b
  scenario_file: benchmarks/HumanEval/Tasks/human_eval_AgentChatCopyNoCtx.jsonl
  server_port: 31035
  config_template: scripts/configs/config-twoturn-template.yaml
  server_port_map:
    model_config_turn1: 31035
    model_config_turn2: 31036
  repeat: 2
server_startup_timeout: 600
server_health_check_interval: 5
shutdown_timeout: 30

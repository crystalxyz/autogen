
# Two-turn benchmark configuration
# Turn 1: 8nt (port 31023)
# Turn 2: 14nt (port 31024)

servers:
- model: Qwen/Qwen3-8B
  port: 31023
  tp: 1
  mem_fraction: 0.95
  device: 0
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
- model: Qwen/Qwen3-14B
  port: 31024
  tp: 1
  mem_fraction: 0.95
  device: 1
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
benchmarks:
- name: humaneval_twoturn_8b_14b
  scenario_file: benchmarks/HumanEval/Tasks/human_eval_AgentChatCopyNoCtx.jsonl
  server_port: 31023
  config_template: scripts/configs/config-twoturn-template.yaml
  server_port_map:
    model_config_turn1: 31023
    model_config_turn2: 31024
  repeat: 2
server_startup_timeout: 600
server_health_check_interval: 5
shutdown_timeout: 30

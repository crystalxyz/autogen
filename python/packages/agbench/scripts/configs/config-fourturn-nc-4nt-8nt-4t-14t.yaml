# Four-turn benchmark configuration
# Turn 1: 4nt (port 31200)
# Turn 2: 8nt (port 31201)
# Turn 3: 4t (port 31202)
# Turn 4: 14t (port 31203)

servers:
- model: Qwen/Qwen3-4B
  port: 31200
  tp: 1
  mem_fraction: 0.95
  device: 0
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
- model: Qwen/Qwen3-8B
  port: 31201
  tp: 1
  mem_fraction: 0.95
  device: 1
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
- model: Qwen/Qwen3-4B
  port: 31202
  tp: 1
  mem_fraction: 0.95
  device: 2
  extra_body:
    chat_template_kwargs:
      enable_thinking: true
- model: Qwen/Qwen3-14B
  port: 31203
  tp: 1
  mem_fraction: 0.95
  device: 3
  extra_body:
    chat_template_kwargs:
      enable_thinking: true
benchmarks:
- name: humaneval_fourturn_4b_8b_4b_14b
  scenario_file: benchmarks/HumanEval/Tasks/human_eval_AgentChatCopyNoCtx.jsonl
  server_port: 31200
  config_template: scripts/configs/config-fourturn-template.yaml
  server_port_map:
    model_config_turn1: 31200
    model_config_turn2: 31201
    model_config_turn3: 31202
    model_config_turn4: 31203
  repeat: 3
server_startup_timeout: 600
server_health_check_interval: 5
shutdown_timeout: 30

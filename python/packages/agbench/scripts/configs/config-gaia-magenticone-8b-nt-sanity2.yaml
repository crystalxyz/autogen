# GAIA MagenticOne: Qwen3-8B non-thinking — SANITY (2 tasks)

servers:
  - model: "Qwen/Qwen3-8B"
    port: 40021
    tp: 1
    mem_fraction: 0.9
    device: 0
    extra_body:
      chat_template_kwargs:
        enable_thinking: false

benchmarks:
  - name: "gaia_magenticone_qwen3_8b_nt_sanity2"
    scenario_file: "benchmarks/GAIA/Tasks/gaia_validation_level_1__MagenticOne.jsonl"
    config_template: "scripts/configs/config-gaia-magenticone-template.yaml"
    server_port: 40021
    num_concurrent: 1
    repeat: 1
    extra_args: ["--subsample", "2"]

server_startup_timeout: 600
server_health_check_interval: 5
shutdown_timeout: 30

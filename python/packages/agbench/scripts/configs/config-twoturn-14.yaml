
# Two-turn benchmark configuration
# Turn 1: qwen3-0.6b nothink (port 30011)
# Turn 2: qwen3-4b think (port 30012)

servers:
  - model: "Qwen/Qwen3-1.7B"
    port: 30019
    tp: 1
    mem_fraction: 0.8
    device: 0
    extra_body:
      chat_template_kwargs:
        enable_thinking: false

  - model: "Qwen/Qwen3-1.7B"
    port: 30020
    tp: 1
    mem_fraction: 0.6
    device: 1
    extra_body:
      chat_template_kwargs:
        enable_thinking: true

benchmarks:
  - name: "humaneval_twoturn_1.7b_1.7b"
    scenario_file: "benchmarks/HumanEval/Tasks/human_eval_AgentChatCopyNoCtx.jsonl"
    server_port: 30019
    config_template: "scripts/configs/config-twoturn-template.yaml"
    server_port_map:
      model_config_turn1: 30019
      model_config_turn2: 30020
    repeat: 2

server_startup_timeout: 600
server_health_check_interval: 5
shutdown_timeout: 30

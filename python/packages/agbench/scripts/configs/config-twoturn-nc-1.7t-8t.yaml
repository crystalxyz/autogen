
# Two-turn benchmark configuration
# Turn 1: 1.7t (port 31059)
# Turn 2: 8t (port 31060)

servers:
- model: Qwen/Qwen3-1.7B
  port: 31059
  tp: 1
  mem_fraction: 0.95
  device: 0
  extra_body:
    chat_template_kwargs:
      enable_thinking: true
- model: Qwen/Qwen3-8B
  port: 31060
  tp: 1
  mem_fraction: 0.95
  device: 1
  extra_body:
    chat_template_kwargs:
      enable_thinking: true
benchmarks:
- name: humaneval_twoturn_1.7b_8b
  scenario_file: benchmarks/HumanEval/Tasks/human_eval_AgentChatCopyNoCtx.jsonl
  server_port: 31059
  config_template: scripts/configs/config-twoturn-template.yaml
  server_port_map:
    model_config_turn1: 31059
    model_config_turn2: 31060
  repeat: 2
server_startup_timeout: 600
server_health_check_interval: 5
shutdown_timeout: 30

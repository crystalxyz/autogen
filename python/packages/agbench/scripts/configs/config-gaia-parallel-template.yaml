# Config template for GAIA ParallelAgents (single-model)
# All four agent clients share the same model_config via YAML anchors.

model_config: &client
  provider: autogen_ext.models.openai.OpenAIChatCompletionClient
  config:
    model: placeholder
    base_url: http://0.0.0.0:40022/v1
    api_key: EMPTY
    stream_options:
      include_usage: true
    model_info:
      family: Qwen
      vision: false
      function_calling: true
      json_output: true
      structured_output: true

orchestrator_client: *client
coder_client: *client
web_surfer_client: *client
file_surfer_client: *client

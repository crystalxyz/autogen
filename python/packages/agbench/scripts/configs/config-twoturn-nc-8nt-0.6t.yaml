
# Two-turn benchmark configuration
# Turn 1: 8nt (port 31025)
# Turn 2: 0.6t (port 31026)

servers:
- model: Qwen/Qwen3-8B
  port: 31025
  tp: 1
  mem_fraction: 0.95
  device: 0
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
- model: Qwen/Qwen3-0.6B
  port: 31026
  tp: 1
  mem_fraction: 0.95
  device: 1
  extra_body:
    chat_template_kwargs:
      enable_thinking: true
benchmarks:
- name: humaneval_twoturn_8b_0.6b
  scenario_file: benchmarks/HumanEval/Tasks/human_eval_AgentChatCopyNoCtx.jsonl
  server_port: 31025
  config_template: scripts/configs/config-twoturn-template.yaml
  server_port_map:
    model_config_turn1: 31025
    model_config_turn2: 31026
  repeat: 2
server_startup_timeout: 600
server_health_check_interval: 5
shutdown_timeout: 30

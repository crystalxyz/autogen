# Three-turn benchmark configuration
# Turn 1: 1.7nt (port 31121)
# Turn 2: 4nt (port 31122)
# Turn 3: 14nt (port 31123)

servers:
- model: Qwen/Qwen3-1.7B
  port: 31121
  tp: 1
  mem_fraction: 0.95
  device: 0
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
- model: Qwen/Qwen3-4B
  port: 31122
  tp: 1
  mem_fraction: 0.95
  device: 1
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
- model: Qwen/Qwen3-14B
  port: 31123
  tp: 1
  mem_fraction: 0.95
  device: 2
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
benchmarks:
- name: humaneval_threeturn_1.7b_4b_14b
  scenario_file: benchmarks/HumanEval/Tasks/human_eval_AgentChatCopyNoCtx.jsonl
  server_port: 31121
  config_template: scripts/configs/config-threeturn-template.yaml
  server_port_map:
    model_config_turn1: 31121
    model_config_turn2: 31122
    model_config_turn3: 31123
  repeat: 3
server_startup_timeout: 600
server_health_check_interval: 5
shutdown_timeout: 30

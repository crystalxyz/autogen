# HotpotQA SelectorGroupChat: google/gemma-4-E2B-it thinking

servers:
  - model: "google/gemma-4-E2B-it"
    port: 30022
    tp: 1
    mem_fraction: 0.9
    device: 0
    reasoning_parser: gemma4
    tool_call_parser: gemma4
    extra_body:
      chat_template_kwargs:
        enable_thinking: true

benchmarks:
  - name: "hotpotqa_selector_gemma4_e2b_t"
    scenario_file: "benchmarks/HotpotQA/Tasks/hotpotqa_validation_fullwiki__SelectorGroupChat_sanity100_seed42.jsonl"
    config_template: "scripts/configs/config-hotpotqa-selector-template.yaml"
    server_port: 30022
    num_concurrent: 2
    repeat: 3

server_startup_timeout: 600
server_health_check_interval: 5
shutdown_timeout: 30

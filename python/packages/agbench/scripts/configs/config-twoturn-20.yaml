
# Two-turn benchmark configuration
# Turn 1: qwen3-14b nothink (port 30021)
# Turn 2: qwen3-8b think (port 30022)

servers:
  - model: "Qwen/Qwen3-14B"
    port: 30035
    tp: 1
    mem_fraction: 0.95
    device: 0
    extra_body:
      chat_template_kwargs:
        enable_thinking: false

  - model: "Qwen/Qwen3-8B"
    port: 30036
    tp: 1
    mem_fraction: 0.95
    device: 1
    extra_body:
      chat_template_kwargs:
        enable_thinking: true

benchmarks:
  - name: "humaneval_twoturn_14bnt_8bt"
    scenario_file: "benchmarks/HumanEval/Tasks/human_eval_AgentChatCopyNoCtx.jsonl"
    server_port: 30035
    config_template: "scripts/configs/config-twoturn-template.yaml"
    server_port_map:
      model_config_turn1: 30035
      model_config_turn2: 30036
    repeat: 2

server_startup_timeout: 600
server_health_check_interval: 5
shutdown_timeout: 30

# Three-turn benchmark configuration
# Turn 1: 1.7nt (port 31148)
# Turn 2: 4nt (port 31149)
# Turn 3: 4t (port 31150)

servers:
- model: Qwen/Qwen3-1.7B
  port: 31148
  tp: 1
  mem_fraction: 0.95
  device: 0
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
- model: Qwen/Qwen3-4B
  port: 31149
  tp: 1
  mem_fraction: 0.95
  device: 1
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
- model: Qwen/Qwen3-4B
  port: 31150
  tp: 1
  mem_fraction: 0.95
  device: 2
  extra_body:
    chat_template_kwargs:
      enable_thinking: true
benchmarks:
- name: humaneval_threeturn_1.7b_4b_4b
  scenario_file: benchmarks/HumanEval/Tasks/human_eval_AgentChatCopyNoCtx.jsonl
  server_port: 31148
  config_template: scripts/configs/config-threeturn-template.yaml
  server_port_map:
    model_config_turn1: 31148
    model_config_turn2: 31149
    model_config_turn3: 31150
  repeat: 3
server_startup_timeout: 600
server_health_check_interval: 5
shutdown_timeout: 30

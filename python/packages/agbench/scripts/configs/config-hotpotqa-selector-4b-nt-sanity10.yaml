# HotpotQA SelectorGroupChat sanity check: Qwen3-4B non-thinking on port 30004.
# Runs the 10-task sanity subset of the fullwiki split.

servers:
  - model: "Qwen/Qwen3-4B"
    port: 30004
    tp: 1
    mem_fraction: 0.9
    device: 0
    extra_body:
      chat_template_kwargs:
        enable_thinking: false

benchmarks:
  - name: "hotpotqa_selector_qwen3_4b_nt_sanity10"
    scenario_file: "benchmarks/HotpotQA/Tasks/hotpotqa_validation_fullwiki__SelectorGroupChat_sanity10.jsonl"
    config_template: "scripts/configs/config-hotpotqa-selector-template.yaml"
    server_port: 30004
    num_concurrent: 1
    repeat: 1

server_startup_timeout: 600
server_health_check_interval: 5
shutdown_timeout: 30

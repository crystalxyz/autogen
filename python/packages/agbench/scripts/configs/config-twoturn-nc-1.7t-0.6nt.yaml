
# Two-turn benchmark configuration
# Turn 1: 1.7t (port 31047)
# Turn 2: 0.6nt (port 31048)

servers:
- model: Qwen/Qwen3-1.7B
  port: 31047
  tp: 1
  mem_fraction: 0.95
  device: 0
  extra_body:
    chat_template_kwargs:
      enable_thinking: true
- model: Qwen/Qwen3-0.6B
  port: 31048
  tp: 1
  mem_fraction: 0.95
  device: 1
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
benchmarks:
- name: humaneval_twoturn_1.7b_0.6b
  scenario_file: benchmarks/HumanEval/Tasks/human_eval_AgentChatCopyNoCtx.jsonl
  server_port: 31047
  config_template: scripts/configs/config-twoturn-template.yaml
  server_port_map:
    model_config_turn1: 31047
    model_config_turn2: 31048
  repeat: 2
server_startup_timeout: 600
server_health_check_interval: 5
shutdown_timeout: 30

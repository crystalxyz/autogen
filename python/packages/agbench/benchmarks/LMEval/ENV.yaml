# ENV.yaml
#
# Environment variables passed into each LMEval task. lm-eval's
# local-chat-completions adapter reads OPENAI_API_KEY unconditionally even
# when talking to a local SGLang server, so we export a dummy value. If the
# user has a real key on the host, it is forwarded instead.

OPENAI_API_KEY: ${OPENAI_API_KEY}
